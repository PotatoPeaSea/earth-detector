<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earth Detector - One Figure</title>
<style>
:root{
  --fg:#111; --mute:#666; --faint:#999; --line:#d9d9d9;
  --c:#2ca02c; --bg:#fff;
}
body.st-1{--c:#d99a00;}
body.st-2{--c:#d62728;--bg:#fff5f4;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:"DejaVu Sans",Verdana,"Bitstream Vera Sans",sans-serif;font-size:13px;
  display:flex;flex-direction:column;min-height:100vh;transition:background .35s;
}
header{display:flex;align-items:flex-end;gap:56px;padding:22px 48px 14px;flex-wrap:wrap}
.item .cap{font-size:11px;color:var(--mute);margin-bottom:2px;white-space:nowrap}
.item .num{font-size:32px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .num small{font-size:12px;color:var(--mute);margin-left:4px}
.item .num .pm{font-size:14px;color:var(--mute);margin-left:6px}
.item.held .num{color:var(--faint)}
#stWord{color:var(--c);font-weight:bold;min-width:190px;letter-spacing:.02em}
#rule{height:2px;background:var(--c);margin:0 48px;transition:background .35s}
body.st-2 #rule{height:4px}
main{flex:1;display:flex;flex-direction:column;padding:6px 48px 0;min-height:0}
#plotWrap{position:relative;flex:1;min-height:340px}
#plot{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#verdict{font-size:13px;color:#333;margin:8px 0 10px;min-height:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px;color:var(--mute);font-size:12px}
.bar .grp{display:flex;align-items:center;gap:8px}
button{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:2px;padding:3px 10px;cursor:pointer}
button:hover{border-color:#888}
button:focus-visible{outline:2px solid #1f77b4;outline-offset:1px}
#evBox{margin-bottom:10px;max-height:230px;overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 14px 5px 0;border-bottom:1px solid #eee;white-space:nowrap}
th{font-weight:bold;color:var(--mute);position:sticky;top:0;background:var(--bg)}
td.r,th.r{text-align:right}
.empty{padding:8px 0;color:var(--mute)}
footer{padding:0 48px 14px;font-size:11px;color:var(--faint)}
[hidden]{display:none!important}
@media (max-width:1500px){header{gap:36px;padding:16px 32px 10px}#rule{margin:0 32px}main{padding:4px 32px 0}footer{padding:0 32px 10px}.item .num{font-size:28px}#stWord{min-width:160px}}
</style>
</head>
<body class="st-0">
<header>
  <div class="item"><div class="cap">System status</div><div class="num" id="stWord">IDLE</div></div>
  <div class="item held" id="itF"><div class="cap" id="fCap">Frequency</div><div class="num"><span id="fVal">&mdash;</span><span class="pm" id="fUnc"></span><small>Hz</small></div></div>
  <div class="item"><div class="cap">Peak (S1)</div><div class="num"><span id="pkVal">0.000</span><small>g</small></div></div>
  <div class="item"><div class="cap">RMS (S1)</div><div class="num"><span id="rmsVal">0.000</span><small>g</small></div></div>
  <div class="item held" id="itM"><div class="cap" id="magCap">Magnitude</div><div class="num"><span id="magVal">&mdash;</span></div></div>
  <div class="item held" id="itA"><div class="cap">Amplification S1/S2</div><div class="num"><span id="ampVal">&mdash;</span></div></div>
</header>
<div id="rule"></div>
<main>
  <div id="plotWrap"><canvas id="plot"></canvas></div>
  <div id="verdict">No events yet.</div>
  <div class="bar">
    <div class="grp">Simulator:
      <button id="btnBump" title="Key: B">Bump</button>
      <button id="btnQuake" title="Key: E">Earthquake</button>
      <button id="btnAuto" title="Key: A">Auto: on</button>
    </div>
    <div class="grp"><span>Click a legend entry to show or hide its line.</span>
      <button id="btnEvents" aria-expanded="false">Events (0)</button></div>
  </div>
  <div id="evBox" hidden></div>
</main>
<footer id="foot"></footer>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const PI2=Math.PI*2;
const FS=200, RB=8192, RM=RB-1, WIN=100, RD=4096, DM=RD-1;
const ON=0.05, OFF=0.03, CREST_MAX=3.2, SUSTAIN=0.4, LATCH=3.0, NOISE=0.004;
const BASE=[[0.012,-0.008,1.018],[-0.015,0.010,0.980]];
const LVW=['none','micro','weak','moderate','strong','severe'];
const FFT_AFTER=4;           // seconds of quake data before switching to FFT
const MINUS='−';

/* ---------- filters (0.5-20 Hz band-pass) ---------- */
function biquad(type,fc,fs,Q){
  const w0=PI2*fc/fs,c=Math.cos(w0),s=Math.sin(w0),al=s/(2*Q);
  let b0,b1,b2;
  if(type==='hp'){b0=(1+c)/2;b1=-(1+c);b2=(1+c)/2;}else{b0=(1-c)/2;b1=1-c;b2=(1-c)/2;}
  const a0=1+al,a1=-2*c,a2=1-al;
  return {b0:b0/a0,b1:b1/a0,b2:b2/a0,a1:a1/a0,a2:a2/a0};
}
const HP=biquad('hp',0.5,FS,Math.SQRT1_2), LP=biquad('lp',20,FS,Math.SQRT1_2);
function run(q,st,x){const y=q.b0*x+st.z1;st.z1=q.b1*x-q.a1*y+st.z2;st.z2=q.b2*x-q.a2*y;return y;}

/* ---------- data ---------- */
function mkSensor(){
  return {raw:[new Float32Array(RB),new Float32Array(RB),new Float32Array(RB)],
          flt:[new Float32Array(RB),new Float32Array(RB),new Float32Array(RB)],
          mag:new Float32Array(RB), win:new Float32Array(WIN), wi:0, sumsq:0, rms:0, pkw:0,
          f:[0,1,2].map(()=>({init:false,hp:{z1:0,z2:0},lp:{z1:0,z2:0}})), nf:1.6e-5};
}
const S=[mkSensor(),mkSensor()];
const rmsD=[new Float32Array(RD),new Float32Array(RD)], stD=new Uint8Array(RD);
let n=0;
function gauss(){let u=0;while(u===0)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(PI2*Math.random());}

/* ---------- simulator ---------- */
const events=[]; const sg=[0,0,0];
let auto=true, ph=4, phEnd=0, firstQ=true;
const PH=[{d:6},{d:0.4,fire:'b'},{d:5},{d:8,fire:'q'},{d:6}];
function fireBump(){
  const t=n/FS;
  events.push({k:'b',t0:t,A:0.3+Math.random()*0.5,f:20+Math.random()*10,tau:0.05+Math.random()*0.025,dir:[0.85,0.3+Math.random()*0.2,0.45+Math.random()*0.2]});
}
function fireQuake(f){
  const t=n/FS;
  for(const e of events) if(e.k==='q') return;
  events.push({k:'q',t0:t,D:8,f:f||(3+Math.random()*5),a2:0.14+Math.random()*0.03,a1:0.33+Math.random()*0.07,lag:0.35+Math.random()*0.2});
}
function autoTick(t){
  if(!auto) return;
  if(t>=phEnd){
    ph=(ph+1)%PH.length; const p=PH[ph]; phEnd=t+p.d;
    if(p.fire==='b') fireBump();
    else if(p.fire==='q'){ fireQuake(firstQ?4.72:0); firstQ=false; }
  }
}
function eventSig(s,t){
  sg[0]=sg[1]=sg[2]=0;
  for(let i=0;i<events.length;i++){
    const e=events[i], tt=t-e.t0; if(tt<0) continue;
    if(e.k==='b'){
      if(tt>1.5) continue;
      const g=(s===0?1:0.12)*e.A*Math.exp(-tt/e.tau)*Math.sin(PI2*e.f*tt);
      sg[0]+=g*e.dir[0]; sg[1]+=g*e.dir[1]; sg[2]+=g*e.dir[2];
    }else{
      if(tt>e.D) continue;
      const env=Math.max(0,Math.min(1,tt,e.D-tt));
      const amp=(s===0?e.a1:e.a2)*env, th=PI2*e.f*tt-(s===0?e.lag:0);
      sg[0]+=amp*(Math.sin(th)+0.1*Math.sin(2*th+0.7));
      sg[1]+=0.22*amp*Math.sin(th+1.1);
      sg[2]+=0.10*amp*Math.sin(th+2.0);
    }
  }
}

/* ---------- detection ---------- */
const det={state:0,timer:0,lastAbove:0,alarmLat:0,rmsHold:0,peak:[0,0],crest:0};
let ev=null, log=[], markers=[], lastVerdict=null, logDirty=true;
const fx={lock:false,f:0,fe:0,unc:0.02,conf:0,snr:0,amp:0,axis:0};
function level(r){return (r>=0.02)+(r>=0.05)+(r>=0.10)+(r>=0.18)+(r>=0.32);}
const pad=(v,l)=>String(v).padStart(l,'0');
const clock=d=>pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)+':'+pad(d.getSeconds(),2);

function detect(t){
  const s0=S[0], rms=s0.rms, mag=s0.mag[n&RM], dt=1/FS;
  const crest=rms>0.02?s0.pkw/rms:0; det.crest=crest;
  det.rmsHold=Math.max(rms,det.rmsHold*Math.exp(-dt/1.5));
  for(let s=0;s<2;s++) det.peak[s]=Math.max(S[s].mag[n&RM],det.peak[s]-0.05*dt);
  const above=rms>ON, hold=rms>OFF, periodic=crest<CREST_MAX;
  if(!ev && (above||mag>0.12)){
    ev={n0:n,t0:t,lastAct:t,lastMag:t,peak:0,alarm:false,rmsMax:0,crest:0,freq:null,fsrc:'',lat:0};
  }
  if(det.state===2){
    if(hold){det.lastAbove=t; if(periodic) det.timer=Math.min(1,det.timer+dt);}
    if(t-det.lastAbove>=LATCH){det.state=0;det.timer=0;}
  }else{
    if(det.state===0&&above) det.state=1;
    else if(det.state===1&&!hold){det.state=0;det.timer=0;}
    if(det.state===1){
      if(above&&periodic) det.timer+=dt; else det.timer=Math.max(0,det.timer-dt*2);
      if(det.timer>=SUSTAIN){det.state=2;det.lastAbove=t;det.alarmLat=t-(ev?ev.t0:t);if(ev){ev.alarm=true;ev.lat=det.alarmLat;}}
    }else if(det.state===0) det.timer=0;
  }
  if(ev){
    if(mag>ev.peak) ev.peak=mag;
    if(rms>OFF||mag>0.12) ev.lastAct=t;
    if(mag>0.04) ev.lastMag=t;
    if(rms>ev.rmsMax){ev.rmsMax=rms;ev.crest=crest;}
    if(det.state===0&&t-ev.lastAct>0.5) finalize();
  }
}
function finalize(){
  const e=ev; ev=null; if(!e||e.peak<0.08) return;
  const dur=Math.max(0.05,e.lastMag-e.t0);
  const q=e.alarm, now=new Date();
  const row={t:now,cls:q?'q':'b',peak:e.peak,dur,freq:q?e.freq:null,src:e.fsrc,crest:e.crest,lvl:level(e.rmsMax)};
  log.unshift(row); if(log.length>40) log.pop(); logDirty=true;
  markers.push({n0:e.n0,cls:row.cls}); if(markers.length>20) markers.shift();
  if(q){
    lastVerdict='Last event '+clock(now)+' — earthquake confirmed: '+dur.toFixed(1)+' s'+(e.freq?' at '+e.freq.toFixed(2)+' Hz':'')+', peak '+e.peak.toFixed(2)+' g, crest factor '+e.crest.toFixed(1)+', alarm after '+e.lat.toFixed(2)+' s.';
  }else{
    lastVerdict='Last event '+clock(now)+' — rejected as bump: '+dur.toFixed(2)+' s, peak '+e.peak.toFixed(2)+' g, crest factor '+e.crest.toFixed(1)+'.';
  }
}

/* ---------- FFT (Hann window, parabolic peak interpolation) ---------- */
const NF=2048, NW=FFT_AFTER*FS, NB=256, DF=FS/NF;
const cosT=new Float64Array(NF/2), sinT=new Float64Array(NF/2), rev=new Uint16Array(NF);
for(let i=0;i<NF/2;i++){cosT[i]=Math.cos(PI2*i/NF);sinT[i]=-Math.sin(PI2*i/NF);}
for(let i=0;i<NF;i++){let r=0,x=i;for(let b=0;b<11;b++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
const hann=new Float64Array(NW); let sumW=0;
for(let i=0;i<NW;i++){hann[i]=0.5-0.5*Math.cos(PI2*i/(NW-1));sumW+=hann[i];}
const re=new Float64Array(NF), im=new Float64Array(NF), amp=new Float32Array(NB);
function fft(){
  for(let i=0;i<NF;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let len=2;len<=NF;len<<=1){
    const half=len>>1, step=NF/len;
    for(let i=0;i<NF;i+=len){
      for(let j=0;j<half;j++){
        const wr=cosT[j*step], wi=sinT[j*step], a=i+j, b=a+half;
        const tr=re[b]*wr-im[b]*wi, ti=re[b]*wi+im[b]*wr;
        re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti;
      }
    }
  }
}
function updateSpectrum(){
  const arrs=S[0].flt; let best=0,bv=-1;
  for(let a=0;a<3;a++){let v=0;for(let i=0;i<NW;i+=2){const x=arrs[a][(n-NW+i)&RM];v+=x*x;}if(v>bv){bv=v;best=a;}}
  fx.axis=best; const arr=arrs[best];
  for(let i=0;i<NW;i++){re[i]=arr[(n-NW+i)&RM]*hann[i];im[i]=0;}
  for(let i=NW;i<NF;i++){re[i]=0;im[i]=0;}
  fft();
  const norm=2/sumW; let kp=0,mx=0,total=0;
  for(let k=0;k<NB;k++){const a=Math.hypot(re[k],im[k])*norm;amp[k]=a;if(k>=11){total+=a*a;if(a>mx){mx=a;kp=k;}}}
  let pb=0;for(let k=Math.max(11,kp-5);k<=Math.min(NB-1,kp+5);k++)pb+=amp[k]*amp[k];
  const conf=total>0?pb/total:0;
  const noise=(total-pb)/Math.max(1,(NB-11-11)); const snr=mx*mx/Math.max(noise,1e-14);
  let f=kp*DF;
  if(kp>0&&kp<NB-1){const a=Math.log(amp[kp-1]+1e-12),b=Math.log(amp[kp]+1e-12),c=Math.log(amp[kp+1]+1e-12);const d=a-2*b+c;if(d!==0)f=(kp+0.5*(a-c)/d)*DF;}
  const lock=conf>0.45&&mx>0.01;
  if(lock){fx.fe=fx.lock?fx.fe+0.35*(f-fx.fe):f;}
  fx.lock=lock;fx.f=f;fx.conf=conf;fx.amp=mx;fx.snr=snr;
  fx.unc=Math.min(1,Math.max(0.01,0.2/(2*Math.sqrt(Math.min(snr,1e4)/10))));
}

/* ---------- quick zero-crossing estimate (valid within ~1 s) ---------- */
function zcEst(){
  const arr=S[0].flt[fx.axis], N=500; let mx=0;
  for(let i=0;i<N;i++){const v=Math.abs(arr[(n-N+i)&RM]);if(v>mx)mx=v;}
  const thr=Math.max(0.025,0.3*mx);
  let armed=false,cnt=0,first=0,last=0,prev=arr[(n-N)&RM];
  for(let i=1;i<N;i++){
    const x=arr[(n-N+i)&RM];
    if(x<-thr) armed=true;
    if(armed&&prev<0&&x>=0){const tt=i-1+(-prev)/(x-prev);if(cnt===0)first=tt;last=tt;cnt++;armed=false;}
    prev=x;
  }
  if(cnt<2) return null;
  const f=FS*(cnt-1)/(last-first);
  if(f<1||f>15) return null;
  return {f,unc:Math.max(0.05,f/(cnt-1)*0.25)};
}

/* ---------- step ---------- */
function step(){
  const t=n/FS, ix=n&RM;
  autoTick(t);
  for(let i=events.length-1;i>=0;i--){const e=events[i];if(t-e.t0>(e.k==='b'?1.5:e.D+0.1))events.splice(i,1);}
  for(let s=0;s<2;s++){
    const Ss=S[s]; eventSig(s,t); let m2=0;
    for(let a=0;a<3;a++){
      const raw=BASE[s][a]+gauss()*NOISE+sg[a];
      Ss.raw[a][ix]=raw;
      const f=Ss.f[a];
      if(!f.init){f.init=true;f.hp.z1=-HP.b0*raw;f.hp.z2=HP.b2*raw;}
      const y=run(LP,f.lp,run(HP,f.hp,raw));
      Ss.flt[a][ix]=y; m2+=y*y;
    }
    Ss.mag[ix]=Math.sqrt(m2);
    Ss.sumsq+=m2-Ss.win[Ss.wi]; if(Ss.sumsq<0)Ss.sumsq=0; Ss.win[Ss.wi]=m2; Ss.wi=(Ss.wi+1)%WIN;
    Ss.rms=Math.sqrt(Ss.sumsq/WIN);
    let pk=0;for(let i=0;i<WIN;i++){if(Ss.win[i]>pk)pk=Ss.win[i];} Ss.pkw=Math.sqrt(pk);
    if(det.state===0&&!ev&&n>0){const d=Ss.raw[0][ix]-Ss.raw[0][(n-1)&RM];Ss.nf+=0.002*(d*d/2-Ss.nf);}
  }
  detect(t);
  if((n&3)===3){const di=(n>>2)&DM; rmsD[0][di]=S[0].rms; rmsD[1][di]=S[1].rms; stD[di]=det.state;}
  if(n%20===0&&n>=NW) updateSpectrum();
  n++;
}

/* ---------- the one figure ---------- */
const TAB=['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f'];
const SER=[
  {id:'f1',label:'S1 top, filtered (x)',color:TAB[0],on:true,type:'s',s:0,kind:'flt',a:0},
  {id:'f2',label:'S2 base, filtered (x)',color:TAB[1],on:true,type:'s',s:1,kind:'flt',a:0},
  {id:'rm',label:'S1 RMS envelope',color:TAB[2],on:true,type:'r',s:0},
  {id:'on',label:'Alarm ON ('+ON.toFixed(3)+' g RMS)',color:TAB[3],on:true,type:'h',v:ON,dash:true},
  {id:'of',label:'Alarm OFF ('+OFF.toFixed(3)+' g RMS)',color:TAB[5],on:false,type:'h',v:OFF,dash:true},
  {id:'rx',label:'S1 raw x',color:TAB[4],on:false,type:'s',s:0,kind:'raw',a:0},
  {id:'ry',label:'S1 raw y',color:TAB[6],on:false,type:'s',s:0,kind:'raw',a:1},
  {id:'rz',label:'S1 raw z',color:TAB[7],on:false,type:'s',s:0,kind:'raw',a:2}
];
const cv=$('plot'), ctx=cv.getContext('2d'); let CW=1,CH=1;
function fit(){
  const r=$('plotWrap').getBoundingClientRect(),d=window.devicePixelRatio||1;
  CW=Math.max(200,r.width);CH=Math.max(200,r.height);
  cv.width=Math.round(CW*d);cv.height=Math.round(CH*d);ctx.setTransform(d,0,0,d,0,0);
}
if(window.ResizeObserver) new ResizeObserver(fit).observe($('plotWrap'));
window.addEventListener('resize',fit);
const FONT='"DejaVu Sans",Verdana,"Bitstream Vera Sans",sans-serif';
let ylo=-0.12,yhi=0.12, legRects=[];
function niceStep(range){
  const raw=range/7,m=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/m;
  return (r<1.5?1:r<3?2:r<7?5:10)*m;
}
function drawPlot(){
  const w=CW,h=CH,L=68,R=16,T=38,B=50,pw=w-L-R,ph=h-T-B,W=2000;
  ctx.clearRect(0,0,w,h);
  // autoscale to the visible lines
  let mn=-0.12,mx=0.12;
  for(const s of SER){
    if(!s.on) continue;
    if(s.type==='s'){const b=S[s.s][s.kind][s.a];for(let k=n-W;k<n;k+=4){const v=b[k&RM];if(v<mn)mn=v;if(v>mx)mx=v;}}
    else if(s.type==='r'){const d1=n>>2;for(let k=d1-500;k<d1;k+=2){const v=rmsD[s.s][k&DM];if(v>mx)mx=v;}}
  }
  const pad=(mx-mn)*0.08, tl=mn-pad, th=mx+pad;
  ylo=tl<ylo?tl:ylo+0.04*(tl-ylo); yhi=th>yhi?th:yhi+0.04*(th-yhi);
  const Y=v=>T+(yhi-v)/(yhi-ylo)*ph, X=k=>L+(1+(k-n)/W)*pw;

  ctx.save();ctx.beginPath();ctx.rect(L,T,pw,ph);ctx.clip();
  // state shading (axvspan)
  const d1=n>>2,d0=d1-500; let prev=0,sx=L;
  const band=(st,x0,x1)=>{if(st>0){ctx.fillStyle=st===2?'rgba(214,39,40,.10)':'rgba(255,200,0,.13)';ctx.fillRect(x0,T,x1-x0,ph);}};
  for(let k=d0;k<=d1;k++){
    const st=k<d1?stD[k&DM]:prev, x=L+(k-d0)/500*pw;
    if(st!==prev){band(prev,sx,x);prev=st;sx=x;}
  }
  band(prev,sx,L+pw);
  // grid
  ctx.lineWidth=1;ctx.strokeStyle='#ececec';
  const step=niceStep(yhi-ylo), dec=Math.max(0,Math.ceil(-Math.log10(step)-1e-9));
  const ticks=[];
  for(let v=Math.ceil(ylo/step)*step;v<=yhi+1e-9;v+=step){const vv=Math.abs(v)<step*1e-6?0:v;ticks.push(vv);const y=Math.round(Y(vv))+.5;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+pw,y);ctx.stroke();}
  for(let i=0;i<=10;i++){const x=Math.round(L+pw*i/10)+.5;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+ph);ctx.stroke();}
  // event markers
  ctx.font='10px '+FONT;ctx.textAlign='left';ctx.textBaseline='top';
  for(const m of markers){
    const x=X(m.n0); if(x<L-2) continue;
    ctx.strokeStyle='#8a8a8a';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(Math.round(x)+.5,T);ctx.lineTo(Math.round(x)+.5,T+ph);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#777';ctx.fillText(m.cls==='q'?'earthquake':'bump (rejected)',x+4,T+4);
  }
  // lines
  ctx.lineWidth=1.5;ctx.lineJoin='round';
  const stride=Math.max(1,Math.floor(W/pw));
  for(let i=SER.length-1;i>=0;i--){
    const s=SER[i]; if(!s.on) continue;
    ctx.strokeStyle=s.color;ctx.beginPath();
    if(s.type==='s'){
      const b=S[s.s][s.kind][s.a];
      for(let k=n-W;k<n;k+=stride){const x=X(k),y=Y(b[k&RM]);k===n-W?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    }else if(s.type==='r'){
      const b=rmsD[s.s];
      for(let k=d0;k<d1;k++){const x=X(k*4+3),y=Y(b[k&DM]);k===d0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    }else{
      ctx.setLineDash([6,4]);const y=Y(s.v);ctx.moveTo(L,y);ctx.lineTo(L+pw,y);
    }
    ctx.stroke();ctx.setLineDash([]);
  }
  ctx.restore();

  // spines (left + bottom), outward ticks, labels
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(L+.5,T);ctx.lineTo(L+.5,T+ph+.5);ctx.lineTo(L+pw,T+ph+.5);ctx.stroke();
  ctx.fillStyle='#000';ctx.font='11px '+FONT;
  ctx.textAlign='right';ctx.textBaseline='middle';
  for(const v of ticks){
    const y=Math.round(Y(v))+.5;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L-4,y);ctx.stroke();
    ctx.fillText((v<0?MINUS:'')+Math.abs(v).toFixed(dec),L-8,y);
  }
  ctx.textAlign='center';ctx.textBaseline='top';
  for(let i=0;i<=10;i++){
    const x=Math.round(L+pw*i/10)+.5;ctx.beginPath();ctx.moveTo(x,T+ph);ctx.lineTo(x,T+ph+4);ctx.stroke();
    ctx.fillText(i===10?'0':MINUS+(10-i),x,T+ph+8);
  }
  ctx.font='12px '+FONT;ctx.fillText('Time (s)',L+pw/2,T+ph+28);
  ctx.save();ctx.translate(16,T+ph/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText('Acceleration (g)',0,0);ctx.restore();
  ctx.font='14px '+FONT;ctx.textBaseline='bottom';
  ctx.fillText('Top floor (S1) and base (S2), band-passed 0.5–20 Hz, last 10 s',L+pw/2,T-12);

  // legend (upper right, doubles as the toggle)
  ctx.font='11px '+FONT;
  let lw=0;for(const s of SER)lw=Math.max(lw,ctx.measureText(s.label).width);
  const rh=17,lp=8,sw=26,bw=lw+sw+lp*2+8,bh=SER.length*rh+lp*2-4;
  const bx=L+pw-bw-8,by=T+8;
  ctx.fillStyle='rgba(255,255,255,.88)';ctx.strokeStyle='#cfcfcf';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(bx+.5,by+.5,bw,bh,2):ctx.rect(bx+.5,by+.5,bw,bh);ctx.fill();ctx.stroke();
  legRects=[];ctx.textAlign='left';ctx.textBaseline='middle';
  SER.forEach((s,i)=>{
    const y=by+lp+i*rh+rh/2-2;
    ctx.globalAlpha=s.on?1:.35;ctx.strokeStyle=s.color;ctx.lineWidth=1.5;
    ctx.setLineDash(s.dash?[5,3]:[]);ctx.beginPath();ctx.moveTo(bx+lp,y);ctx.lineTo(bx+lp+sw-6,y);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;ctx.fillStyle=s.on?'#000':'#aaa';ctx.fillText(s.label,bx+lp+sw,y);
    legRects.push({s,x:bx,y:y-rh/2,w:bw,h:rh});
  });
}
function legHit(e){
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  for(const l of legRects) if(x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<l.y+l.h) return l.s;
  return null;
}
cv.addEventListener('click',e=>{const s=legHit(e);if(s)s.on=!s.on;});
cv.addEventListener('mousemove',e=>{cv.style.cursor=legHit(e)?'pointer':'default';});

/* ---------- readouts ---------- */
const fq={v:null,unc:0,src:'',fresh:false};
const cur={m:null,lv:0}; let ampV=0, prevSt=0, lastMagSeen=0;
function mag(){const mg=Math.max(1,det.rmsHold*1000);return Math.max(0,2*Math.log10(mg)-1);}
function updateUI(){
  const s0=S[0],s1=S[1],t=n/FS,st=det.state, f3=v=>v.toFixed(3);
  if(document.body.className!=='st-'+st){document.body.className='st-'+st;document.title=(st===2?'ALARM — ':'')+'Earth Detector - One Figure';}
  $('stWord').textContent=['IDLE','SHAKING','ALARM'][st];
  // frequency: zero-crossing first, FFT after ~4 s of quake
  if(st>0&&prevSt===0){fq.fresh=false;cur.m=0;cur.lv=0;}
  if(st>0){
    const el=ev?t-ev.t0:0;
    if(st===2&&el>=FFT_AFTER&&fx.lock){fq.v=fx.fe;fq.unc=fx.unc;fq.src='FFT';fq.fresh=true;}
    else{
      const z=zcEst();
      if(z){fq.v=(fq.fresh&&fq.src==='zero-crossing')?fq.v+0.3*(z.f-fq.v):z.f;fq.unc=z.unc;fq.src='zero-crossing';fq.fresh=true;}
    }
    if(ev&&fq.fresh){ev.freq=fq.v;ev.fsrc=fq.src;}
    cur.m=Math.max(cur.m,mag());cur.lv=Math.max(cur.lv,level(det.rmsHold));
  }
  prevSt=st;
  const held=st===0;
  $('itF').classList.toggle('held',held);$('itM').classList.toggle('held',held);$('itA').classList.toggle('held',held);
  if(st>0&&!fq.fresh){$('fVal').textContent='…';$('fUnc').textContent='';$('fCap').textContent='Frequency · measuring';}
  else if(fq.v==null){$('fVal').textContent='—';$('fUnc').textContent='';$('fCap').textContent='Frequency';}
  else{
    $('fVal').textContent=fq.v.toFixed(2);$('fUnc').textContent='± '+fq.unc.toFixed(2);
    $('fCap').textContent='Frequency · '+(held?'last quake · ':'')+(fq.src==='FFT'?'FFT':'quick estimate (zero-crossing)');
  }
  $('pkVal').textContent=f3(det.peak[0]);
  $('rmsVal').textContent=f3(s0.rms);
  if(cur.m==null){$('magVal').textContent='—';$('magCap').textContent='Magnitude';}
  else{$('magVal').textContent=cur.m.toFixed(1);$('magCap').textContent='Magnitude · level '+cur.lv+' ('+LVW[cur.lv]+')'+(held?' · last':'');}
  if(s0.rms>0.02&&s1.rms>0.02&&st>0){const r=s0.rms/s1.rms;ampV=ampV?ampV+0.2*(r-ampV):r;}
  $('ampVal').textContent=ampV?'×'+ampV.toFixed(2):'—';
  // verdict
  let v;
  if(st===1){
    const cr=det.crest;
    v='Checking — RMS '+f3(s0.rms)+' g, crest factor '+cr.toFixed(1)+(cr>=CREST_MAX?' (impulsive, will be rejected)':' (periodic)')+', sustained '+det.timer.toFixed(2)+' of '+SUSTAIN.toFixed(2)+' s.';
  }else if(st===2){
    v='Earthquake confirmed after '+det.alarmLat.toFixed(2)+' s — sustained periodic shaking, crest factor '+det.crest.toFixed(1)+'; red LED and buzzer on.';
  }else v=lastVerdict||'No events yet — waiting for shaking.';
  $('verdict').textContent=v;
  // footnote
  const r1=799.72+0.09*Math.sin(t*0.7)+0.03*Math.sin(t*3.1), r2=799.88+0.08*Math.sin(t*0.5+1)+0.03*Math.sin(t*2.3);
  const lat=14+2.2*Math.sin(t*1.3)+Math.random()*1.6;
  $('foot').textContent='S1 '+r1.toFixed(1)+' Hz · S2 '+r2.toFixed(1)+' Hz (simulated at '+FS+' Hz) · dropped frames 0 · link: simulator · latency '+lat.toFixed(0)+' ms · noise floor S1 '+(Math.sqrt(s0.nf)*1000).toFixed(1)+' mg, S2 '+(Math.sqrt(s1.nf)*1000).toFixed(1)+' mg';
  $('btnEvents').textContent='Events ('+log.length+')';
  if(logDirty&&!$('evBox').hidden) renderLog();
}
function renderLog(){
  logDirty=false;const box=$('evBox');
  if(!log.length){box.innerHTML='<div class="empty">No events yet.</div>';return;}
  let h='<table><thead><tr><th>Time</th><th>Verdict</th><th class="r">Duration (s)</th><th class="r">Peak (g)</th><th class="r">Frequency (Hz)</th><th class="r">Crest factor</th><th class="r">Level</th></tr></thead><tbody>';
  for(const r of log){
    h+='<tr><td>'+clock(r.t)+'</td><td>'+(r.cls==='q'?'earthquake, alarm':'bump, rejected')+'</td><td class="r">'+r.dur.toFixed(2)+'</td><td class="r">'+r.peak.toFixed(3)+'</td><td class="r">'+(r.freq?r.freq.toFixed(2):'—')+'</td><td class="r">'+r.crest.toFixed(1)+'</td><td class="r">'+(r.cls==='q'?Math.max(1,r.lvl):'—')+'</td></tr>';
  }
  box.innerHTML=h+'</tbody></table>';
}

/* ---------- controls ---------- */
$('btnBump').onclick=fireBump;
$('btnQuake').onclick=()=>fireQuake(0);
function setAuto(v){auto=v;$('btnAuto').textContent='Auto: '+(v?'on':'off');if(v){ph=4;phEnd=n/FS+2;}}
$('btnAuto').onclick=()=>setAuto(!auto);
$('btnEvents').onclick=()=>{
  const b=$('evBox'),open=b.hidden;b.hidden=!open;$('btnEvents').setAttribute('aria-expanded',open);
  if(open){renderLog();b.scrollIntoView({block:'nearest'});}
};
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==='b')fireBump();else if(k==='e')fireQuake(0);else if(k==='a')setAuto(!auto);});

/* ---------- main loop ---------- */
for(let i=0;i<3000;i++)step();
let t0=performance.now()-n/FS*1000;
phEnd=n/FS+6;ph=4;
log=[];markers=[];lastVerdict=null;ev=null;
fit();
let lastUi=0;
function frame(now){
  let target=Math.floor((now-t0)*FS/1000);
  if(target-n>600){t0=now-n/FS*1000;target=n;}
  while(n<target)step();
  if(now-lastUi>=100){lastUi=now;updateUI();}
  drawPlot();
  requestAnimationFrame(frame);
}
updateUI();
requestAnimationFrame(frame);
})();
</script>
