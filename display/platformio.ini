; Round status display for the earth detector: ESP32-2424S012 (ESP32-C3-MINI-1U, GC9A01 240x240, CST816D touch).
; The detector board talks to a computer; tools/display_bridge.py forwards its state to this board over USB serial.
;   pio run -d display -t upload      flash (hold BOOT, plug in USB, if the port does not appear)

[env:c3_round]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = lovyan03/LovyanGFX@^1.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
