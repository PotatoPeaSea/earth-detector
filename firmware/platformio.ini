; Unshakeable Earth Detector firmware. One source tree, two targets (see src/hal.h):
;   pio run -e esp32dev     ESP32 DevKit (original, hardware-verified)
;   pio run -e yd_rp2040    YD-RP2040 (arduino-pico + FreeRTOS SMP)

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
upload_port = COM10
upload_speed = 921600
monitor_port = COM10
monitor_speed = 921600
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0

[env:yd_rp2040]
platform = raspberrypi
board = vccgnd_yd_rp2040
framework = arduino
board_build.core = earlephilhower
; Upload: hold BOOT while plugging in for the UF2 drive, or let picotool reboot the board itself.
; The COM port is assigned by Windows and differs from the ESP32's; pass it to tools/monitor.py.
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit GC9A01A@^1.2.0
build_unflags = -Os
build_flags =
    -O2
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -Wl,-u,_printf_float
    -Wl,--wrap=panic
    -Wl,--wrap=rtosFatalError
